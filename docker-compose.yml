services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_GPU: 0
    container_name: reliability-backend
    ports:
      - "8008:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./huggingface_cache:/app/huggingface_cache
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/huggingface_cache
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_MODEL=${LLM_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
    restart: unless-stopped
    networks:
      - reliability-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reliability-frontend
    ports:
      - "5180:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_SHOW_SIDEBAR=${VITE_SHOW_SIDEBAR:-false}

    networks:
      - reliability-net

networks:
  reliability-net:
    driver: bridge
